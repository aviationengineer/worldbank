# Indicator catalog: add codes here without modifying Python.
# Codes: https://data.worldbank.org/indicator
indicators:
  NY.GDP.MKTP.CD: {name: "GDP (current US$)", unit: "US$", topic: "Economy"}
  NY.GDP.PCAP.CD: {name: "GDP per capita (current US$)", unit: "US$", topic: "Economy"}
  NY.GDP.MKTP.KD.ZG: {name: "GDP growth (annual %)", unit: "%", topic: "Economy"}
  SP.POP.TOTL: {name: "Population, total", unit: "persons", topic: "Population"}
