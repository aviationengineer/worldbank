[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbank-data-platform"
version = "0.1.0"
description = "Enterprise Python data ingestion & intelligence framework for World Bank APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ehsan Ullah" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.6",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "gspread>=6.0",
    "google-auth>=2.27",
    "google-api-python-client>=2.120",
    "click>=8.1",
    "plotly>=5.19",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
worldbank = "worldbank_platform.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
